plugins { id 'application' }

dependencies {
    implementation project(':protocol')
    implementation project(':game-core')
    implementation 'com.badlogicgames.gdx:gdx:1.14.2'
    implementation 'com.badlogicgames.gdx:gdx-backend-lwjgl3:1.14.2'
    implementation 'com.badlogicgames.gdx:gdx-freetype:1.14.2'
    runtimeOnly 'com.badlogicgames.gdx:gdx-platform:1.14.2:natives-desktop'
    runtimeOnly 'com.badlogicgames.gdx:gdx-freetype-platform:1.14.2:natives-desktop'
    implementation 'tools.jackson.core:jackson-databind:3.1.5'
    testImplementation platform('org.junit:junit-bom:6.0.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.jspecify:jspecify:1.0.1'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application { mainClass = 'com.gamedead.client.desktop.DesktopLauncher' }

tasks.register('prepareClientDependencies') {
    description = 'Downloads client libraries without starting the application or connecting to PostgreSQL.'
    group = 'build setup'
    doLast {
        configurations.compileClasspath.resolve()
        configurations.runtimeClasspath.resolve()
        configurations.testCompileClasspath.resolve()
        configurations.testRuntimeClasspath.resolve()
    }
}

tasks.register('verifyClientAssets') {
    doLast {
        def font = file('src/main/resources/fonts/NotoSans.ttf')
        def license = file('src/main/resources/fonts/OFL.txt')
        if (!font.exists() || font.length() < 10000 || !license.exists()) {
            throw new GradleException('Run scripts/prepare-client.ps1 yourself to download the Cyrillic font and client libraries.')
        }
    }
}
tasks.named('run') { dependsOn 'verifyClientAssets' }
tasks.named('installDist') { dependsOn 'verifyClientAssets' }

sourceSets {
    desktopCheck {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    desktopCheckImplementation.extendsFrom implementation
    desktopCheckRuntimeOnly.extendsFrom runtimeOnly
}
tasks.register('desktopCheck', JavaExec) {
    description = 'Renders hidden desktop windows, exercises forms and saves screenshots; no server or database required.'
    group = 'verification'
    dependsOn 'desktopCheckClasses', 'verifyClientAssets'
    classpath = sourceSets.desktopCheck.runtimeClasspath
    mainClass = 'com.gamedead.client.ui.DesktopCheck'
}
